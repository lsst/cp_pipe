description: Latiss filter scan construction
instrument: lsst.obs.lsst.Latiss
imports:
  - location: resource://lsst.cp.pipe/resources/pipelines/_ingredients/cpFilterScan.yaml
tasks:
  cpFilterScanIsr:
    class: lsst.ip.isr.IsrTask
    config:
      connections.outputExposure: 'cpFilterScanIsrExp'
      overscan.fitType: 'MEDIAN_PER_ROW'
      doLinearize: false
      doCrosstalk: false
  cpFilterScanMerge:
    class: lsst.cp.pipe.CpFilterScanTask
    config:
      referenceFilter: 'empty~empty'
