description: cp_pipe linearity calibration construction.
instrument: lsst.obs.lsst.Latiss
imports:
  - location: resource://lsst.cp.pipe/resources/pipelines/_ingredients/cpLinearizer.yaml
tasks:
  cpLinearizerSolve:
    class: lsst.cp.pipe.LinearitySolveTask
    config:
      linearityType: Spline
      splineKnots: 10
      maxLinearAdu: 120000
