description: ComCam flat calibration construction
instrument: lsst.obs.lsst.LsstComCam
imports:
  - location: resource://lsst.cp.pipe/resources/pipelines/_ingredients/cpFlat.yaml
tasks:
  cpFlatIsr:
    class: lsst.ip.isr.IsrTask
    config:
      doLinearize: false
      doCrosstalk: false
      doDefect: false
  cpFlatMeasure:
    class: lsst.cp.pipe.CpFlatMeasureTask
    config:
      doVignette: false
